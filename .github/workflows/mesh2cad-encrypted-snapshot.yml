name: Mesh2CAD encrypted snapshot bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out private Mesh2CAD branch
        uses: actions/checkout@v4
        with:
          repository: pierrebssr/mesh2cad
          ref: agent/p1-selection-topology-primitives
          token: ${{ github.token }}
          persist-credentials: false
          path: mesh2cad

