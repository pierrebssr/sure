name: Mesh2CAD encrypted public corpus bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download publisher-hosted public corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir corpus
          curl --fail --location --retry 3 \
            'https://cloud.makogmbh.de/index.php/s/P2pPYpemkXy9ZQk/download' \
            --output corpus/mako-technics-samples.zip
          curl --fail --location --retry 3 \
            'https://scanmotion-3d.de/Welle.zip' \
            --output corpus/scanmotion-shaft.zip
          curl --fail --location --retry 3 \
            'https://scanmotion-3d.de/Alugussteil.zip' \
            --output corpus/scanmotion-cast.zip
          sha256sum corpus/* > corpus/SHA256SUMS
          ls -lh corpus

      - name: Encrypt corpus for local-only validation
        shell: bash
        run: |
          cat > recipient.crt <<'CERT'
