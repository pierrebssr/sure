      - name: Upload encrypted public corpus
        uses: actions/upload-artifact@v4
        with:
          name: mesh2cad-encrypted-public-corpus
          path: mesh2cad-public-corpus.tar.gz.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
